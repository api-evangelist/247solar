aid: 247solar
name: 247Solar
description: >-
  247Solar, Inc. is a zero-carbon energy technology company with MIT origins that designs and
  builds modular third-generation concentrated solar power (CSP) systems delivering round-the-clock
  clean electricity and industrial-grade heat. Its 247Solar Plant couples a high-temperature solar
  receiver (~970C) with the Heat2Power turbine and HeatStore thermal storage, holding energy in
  ceramic pellets or ordinary sand for 20+ hours without batteries or molten salts. The company
  targets mining, microgrids, off-grid and rural electrification, industrial heat, economic
  development zones, grid support, data centers and green hydrogen, and sells through power
  purchase agreements as well as equipment. Headquartered in Great Falls, Virginia, 247Solar is a
  hardware and project-development business; it publishes no public API, developer program or
  machine-readable specification.
